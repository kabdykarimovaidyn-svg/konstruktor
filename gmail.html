<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация Gmail — учебный тренажёр</title><style>*{box-sizing:border-box}body{height:100vh;height:100dvh;margin:0;display:flex;flex-direction:column;font:13px Arial,sans-serif;background:#f4f7fb;color:#293e53}header{display:flex;align-items:center;gap:10px;padding:9px 15px;background:white;border-bottom:1px solid #dae4ef;flex-shrink:0}header a{color:#005ca9;text-decoration:none;font-weight:600;margin-right:auto}button{cursor:pointer;font:inherit;background:#fff;border:1px solid #c6d7e7;border-radius:4px;color:#315a80;padding:6px 12px}button.primary{color:white;background:#005ca9;border-color:#005ca9}button:disabled{opacity:.6}iframe{flex:1;width:100%;min-height:0;border:0}iframe[hidden]{display:none}#done{margin:auto;text-align:center;max-width:680px;padding:30px}#done[hidden]{display:none}#done h1{font-size:26px}#done p{line-height:1.8;color:#6a8197}#status:empty{display:none}#status{font-size:11px;color:#6a8197;margin:0;padding:5px 15px;background:#fff}@media(max-width:600px){header{padding:7px;gap:5px;font-size:11px}button{font-size:10px;padding:6px}header a{font-size:11px}}</style><header><a href="./?v=0.8.2">← Конструктор курсов</a><button id="project">Скачать проект</button><button class="primary" id="scorm">Скачать SCORM</button></header><p id="status" role="status"></p><iframe id="demo" title="Тренажёр регистрации Gmail" sandbox="allow-scripts allow-same-origin allow-forms" allow="fullscreen" allowfullscreen></iframe><section id="done" hidden><h1>Тренажёр пройден</h1><p>Учебная регистрация завершена. Вы можете пройти её ещё раз или скачать курс для загрузки в LMS.</p><button class="primary" id="restart">Пройти заново</button></section><script src="modules/scorm/fields.js?v=0.8.2"></script><script src="assets/js/author/model.js?v=0.8.2"></script><script src="assets/js/author/storage.js?v=0.8.2"></script><script src="assets/js/author/gmail-sample.js?v=0.8.2"></script><script src="modules/scorm/player.js?v=0.8.2"></script><script src="modules/scorm/scorm.js?v=0.8.2"></script><script>
const p=ScenaSamples.createGmail(),frame=document.getElementById('demo'),urls=Object.fromEntries(Object.entries(p.assets).map(([k,a])=>[k,URL.createObjectURL(a.blob)]));let token;
function start(){const course=ScenaModel.toCourse(p);token='gmail-'+Date.now()+'-'+Math.random();course.previewToken=token;frame.srcdoc=ScenaSCORM.preview(course,urls);frame.hidden=false;document.getElementById('done').hidden=true;}start();
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='scena-preview-finished'&&e.data.token===token){frame.hidden=true;frame.srcdoc='';document.getElementById('done').hidden=false;}});document.getElementById('restart').onclick=start;
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);}
async function save(kind){const button=document.getElementById(kind);button.disabled=true;document.getElementById('status').textContent='Подготовка файла…';try{const blob=kind==='project'?await ScenaStorage.file(p):await ScenaSCORM.build(ScenaModel.toCourse(p),Object.fromEntries(Object.entries(p.assets).map(([k,a])=>[k,a.blob])));download(blob,kind==='project'?'gmail-training.scena.json':'gmail-training-scorm12.zip');document.getElementById('status').textContent='Файл готов. '+(kind==='scorm'?'Загрузите ZIP в тестовый курс LMS.':'Импортируйте проект в конструктор.');}catch(e){document.getElementById('status').textContent='Не удалось подготовить файл: '+e.message;}finally{button.disabled=false;}}
document.getElementById('project').onclick=()=>save('project');document.getElementById('scorm').onclick=()=>save('scorm');
</script></html>
